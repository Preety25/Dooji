# Dooji — Render Blueprint (no secrets embedded).
# Manual: create the Web Service + Postgres, then set secret env vars in the dashboard.
# Docs: docs/deploy/RENDER.md

databases:
  - name: dooji-quota
    plan: free

services:
  - type: web
    name: dooji-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m product.api.app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DOOJI_ENV
        value: production
      - key: IMAGE_PROVIDER
        value: xai
      - key: DOOJI_POLICY
        value: postgres
      - key: DOOJI_ANON_GENERATION_LIMIT
        value: "6"
      - key: DOOJI_GLOBAL_DAILY_BUDGET
        value: "500"
      - key: DOOJI_GENERATIONS_DISABLED
        value: "0"
      - key: DOOJI_HOST
        value: "0.0.0.0"
      # Platform PORT is injected by Render automatically.
      - key: DATABASE_URL
        fromDatabase:
          name: dooji-quota
          property: connectionString
      - key: XAI_API_KEY
        sync: false
